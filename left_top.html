<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="left-top-style/header-top.css" />
    <link rel="stylesheet" href="left-top-style/left-sidebar.css" />
  </head>
  <body>
    <div class="top-header">
      <div class="drone">
        <img class="drone-pic" src="pictures/drone.png" />
      </div>
      <div class="top-left">
        <p class="name">Road Vision</p>
        <p class="tag">Real Time Monitoring and AI-powered Road survey</p>
      </div>
      <div class="top-middle">
        <div class="project-details">
          <p class="project-word">Project</p>
          <div>
            <button class="project-area">NH-740(Karnataka)</button>
          </div>
        </div>
        <img class="point" src="pictures/green-dot.png" />
        <div class="status">
          <p class="project-status">Survey completed</p>
          <p class="time">[Last Updated: 17 May 2026,14:31]</p>
        </div>
      </div>
      <div class="top-right">
        <div class="bell">
          <img class="bell-icon" src="pictures/bell.png" />
          <button class="number">3</button>
        </div>
        <div class="profile">
          <img class="profile-icon" src="pictures/profile-pic.png" />
        </div>
        <p class="profile-name">Supervisor</p>
        <p class="profile-place">Govt.of India</p>
      </div>
    </div>
    <div class="left_sidebar">
      <button class="b1">
        <div class="overview">
          <img class="home-icon" src="pictures/home.png" />
          <p class="word1">Overview</p>
        </div>
      </button>
      <button class="b1">
        <div class="map">
          <img class="map-icon" src="pictures/map.png" />
          <p class="word1">Map View</p>
        </div>
      </button>

      <button class="b1">
        <div class="road-width">
          <img class="scale-icon" src="pictures/scale.png" />
          <p class="word1">Road Width</p>
        </div>
      </button>

      <button class="b1">
        <div class="Confidence">
          <img class="shield-icon" src="pictures/shield.png" />
          <p class="word1">Confidence Map</p>
        </div>
      </button>

      <button class="b1">
        <div class="obstacles">
          <img class="danger-icon" src="pictures/danger.png" />
          <p class="word1">Obstacles</p>
        </div>
      </button>

      <button class="b1">
        <div class="reports">
          <img class="report-icon" src="pictures/reports.png" />
          <p class="word1">Reports</p>
        </div>
      </button>

      <button class="b1">
        <div class="elevation">
          <img class="elevation-icon" src="pictures/elevation.png" />
          <p class="word1">Elevation</p>
        </div>
      </button>
      <button class="b1">
        <div class="history">
          <img class="history-icon" src="pictures/history.png" />
          <p class="word1">History</p>
        </div>
      </button>
      <button class="b1">
        <div class="settings">
          <img class="settings-icon" src="pictures/settings.png" />
          <p class="word1">Settings</p>
        </div>
      </button>
      <div class="left_bottom">
        <img class="drone-bottom" src="pictures/drone.png" />
      </div>
    </div>
  </body>
</html>
