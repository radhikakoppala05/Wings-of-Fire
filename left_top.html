<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="left-top-style/header-top.css" />
  </head>
  <body>
    <div class="top-header">
      <div class="drone">
        <img class="drone-pic" src="pictures/drone.png" />
      </div>
      <div class="top-left">
        <p class="name">Road Vision</p>
        <p class="tag">Real Time Monitoring and AI-powered Road survey</p>
      </div>
      <div class="top-middle">
        <div class="project-details">
          <p class="project-word">Project</p>
          <div>
            <button class="project-area">NH-740(Karnataka)</button>
          </div>
        </div>

        <div class="status">
          <p class="project-status">Survey completed</p>
          <p class="time">[Last Updated: 17 May 2026,14:31]</p>
        </div>
      </div>
      <div class="top-right">
        <div class="bell">
          <img class="bell-icon" src="pictures/bell.png" />
          <button class="number">3</button>
        </div>
        <div class="profile">
          <img class="profile-icon" src="pictures/profile-pic.png" />
        </div>
        <p class="profile-name">Supervisor</p>
        <p class="profile-place">Govt.of India</p>
      </div>
    </div>
  </body>
</html>
